server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    default_type application/octet-stream;

    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        image/x-icon ico;
        audio/ogg ogg;
        application/wasm wasm;
        application/octet-stream pck;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        text/css
        text/plain;

    location = /build-info {
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header X-Ironveil-Build "1.3.0" always;
        return 200 '{"name":"IRONVEIL","build":"1.3.0","auth":"nickname-password","input":"desktop-touch","camera":"player-follow","world_ui":"zvlz-editorial","world_membership_repair":true,"api":"/api","room_ws":"/room-ws"}';
    }

    # Keep the browser on one HTTPS origin. Dokploy only needs to publish the
    # client service; nginx forwards API and WebSocket traffic internally.
    location /api/ {
	gzip off;
	proxy_set_header Accept-Encoding "";

        proxy_pass http://lobby:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header X-Ironveil-Build "1.3.0" always;
    }

    location /room-ws {
        proxy_pass http://room-server:9081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        add_header X-Ironveil-Build "1.3.0" always;
    }

    # Godot's default Web export keeps stable names such as index.pck/index.wasm.
    # Revalidate them on every deployment so a browser cannot keep an old PCK/WASM
    # while loading a new index.html or index.js.
    location ~* \.(wasm|pck|js|mjs)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(css|png|jpg|jpeg|svg|ogg)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
