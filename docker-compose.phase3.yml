services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      lobby:
        condition: service_healthy
      room-server:
        condition: service_started
    mem_limit: 192m
    cpus: 0.35

  lobby:
    build:
      context: ./services/lobby
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LOBBY_PORT: "8080"
      PUBLIC_MODE: "${PUBLIC_MODE:-false}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      MAX_ACTIVE_ROOMS: "${MAX_ACTIVE_ROOMS:-16}"
      CREATE_ROOM_LIMIT_PER_MINUTE: "${CREATE_ROOM_LIMIT_PER_MINUTE:-6}"
      PASSWORD_ATTEMPTS_PER_MINUTE: "${PASSWORD_ATTEMPTS_PER_MINUTE:-5}"
      AUTH_ATTEMPTS_PER_MINUTE: "${AUTH_ATTEMPTS_PER_MINUTE:-10}"
      GENERAL_REQUEST_LIMIT_PER_MINUTE: "${GENERAL_REQUEST_LIMIT_PER_MINUTE:-120}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:-2592000}"
      MAX_WORLDS_PER_ACCOUNT: "${MAX_WORLDS_PER_ACCOUNT:-12}"
      MAX_WORLD_CHECKPOINTS: "${MAX_WORLD_CHECKPOINTS:-5}"
      ROOM_TTL_SECONDS: "${ROOM_TTL_SECONDS:-21600}"
      ROOM_TOKEN_SECRET: "${ROOM_TOKEN_SECRET:?Set ROOM_TOKEN_SECRET in .env.phase3}"
      PUBLIC_WS_URL: "${PUBLIC_WS_URL:-ws://127.0.0.1:9081}"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-http://127.0.0.1:8080}"
    volumes:
      - lobby-data:/data
    ports:
      - "8081:8080"
    mem_limit: 128m
    cpus: 0.25

  room-server:
    build:
      context: .
      dockerfile: Dockerfile.room
    restart: unless-stopped
    environment:
      ROOM_PORT: "9081"
      PUBLIC_MODE: "${PUBLIC_MODE:-false}"
      MAX_ACTIVE_ROOMS: "${MAX_ACTIVE_ROOMS:-16}"
      ROOM_TOKEN_SECRET: "${ROOM_TOKEN_SECRET:?Set ROOM_TOKEN_SECRET in .env.phase3}"
    volumes:
      - room-data:/root/.local/share/godot/app_userdata/IRONVEIL
    ports:
      - "9081:9081"
    mem_limit: 768m
    cpus: 1.0

volumes:
  lobby-data:
  room-data:
